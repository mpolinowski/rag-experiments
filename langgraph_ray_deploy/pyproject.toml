[project]
name = "langgraph-ray-deploy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mike Polinowski", email = "mpolinowski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.5",
    "langchain>=1.4.10",
    "langchain-ollama>=1.1.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "python-dotenv>=1.2.4",
    "requests>=2.32.0",
    "ray[serve]>=2.60.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
langgraph-ray-deploy = "langgraph_ray_deploy.main:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
